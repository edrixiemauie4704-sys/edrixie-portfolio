<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- data-static-meta: for crawlers that do not run JS. main.tsx removes them on boot so each route owns one title + description.
         Keep this head in step with content/site.ts and the Home entry in src/app/routes.ts. -->
    <title data-static-meta>Edrixie | SEO Content Writer &amp; Digital Content Specialist</title>
    <meta data-static-meta name="description" content="Explore Edrixie’s SEO articles, website copy, digital marketing content, and graphic design portfolio." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist-var.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Warm light is the default theme; visitors can switch to dark mode in the sidebar. -->
    <meta name="theme-color" content="#EBE3D2" />

    <meta property="og:type" content="website" />
    <!-- Link previews: absolute URLs on your domain. Re-render og-image.png with scripts/make-og-image.mjs. -->
    <meta property="og:site_name" content="Edrixie Portfolio" />
    <meta property="og:url" content="https://edrixieportfolio.com/" />
    <meta property="og:title" content="Edrixie | SEO Content Writer &amp; Digital Content Specialist" />
    <meta property="og:description" content="Explore Edrixie’s SEO articles, website copy, digital marketing content, and graphic design portfolio." />
    <meta property="og:image" content="https://edrixieportfolio.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Edrixie, Content Writer and Digital Content Specialist" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Edrixie | SEO Content Writer &amp; Digital Content Specialist" />
    <meta name="twitter:description" content="Explore Edrixie’s SEO articles, website copy, digital marketing content, and graphic design portfolio." />
    <meta name="twitter:image" content="https://edrixieportfolio.com/og-image.png" />

    <!-- Light by default; a saved dark pick is applied before first paint, so it never flashes light first.
         Mirrors src/lib/theme.ts. The deploy CSP allows this script by hash: after any edit run npm run csp:check. -->
    <script>
      try {
        if (localStorage.getItem('pv2-theme') === 'dark') {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#414833')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
